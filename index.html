<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --green: #00ff88; --red: #ff4444; --card: #111; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #000; color: white; padding: 20px 15px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-family: 'Montserrat'; font-size: 16px; letter-spacing: 1px; }

        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 15px; text-align: center; }
        .stat-box b { display: block; font-size: 20px; color: var(--accent); }

        h2 { font-family: 'Montserrat'; font-size: 18px; margin: 20px 0 10px; color: var(--accent); text-transform: uppercase; }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 30px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid #222; overflow: hidden; position: relative; transition: 0.3s; }
        .card:active { transform: scale(0.95); }
        .card img { width: 100%; height: 110px; object-fit: contain; background: #0a0a0a; padding: 10px; }
        .card-info { padding: 10px; text-align: center; }
        .card-info b { font-size: 11px; display: block; text-transform: uppercase; }
        .del { position: absolute; top: 5px; right: 5px; background: var(--red); color: white; width: 22px; height: 22px; border-radius: 50%; text-align: center; line-height: 20px; font-size: 12px; font-weight: bold; z-index: 5; }

        /* MENU */
        #menu { position: fixed; top: 0; right: -100%; width: 80%; height: 100%; background: #050505; z-index: 1000; transition: 0.3s; padding: 50px 30px; border-left: 1px solid #222; }
        #menu.open { right: 0; }
        .nav-link { display: block; color: white; font-size: 20px; margin-bottom: 25px; text-decoration: none; font-family: 'Montserrat'; }

        .page { display: none; }
        .page.active { display: block; }
        .btn-add { background: var(--accent); color: #000; padding: 15px; border-radius: 15px; text-align: center; font-weight: bold; margin-top: 10px; font-family: 'Montserrat'; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div onclick="toggleMenu()" style="cursor:pointer; color:var(--accent); font-weight:bold;">MENU</div>
    </div>

    <div id="stats-header" class="top-stats">
        <div class="stat-box"><b id="val-lordo">0€</b><span style="font-size:9px; color:#666;">LORDO</span></div>
        <div class="stat-box"><b id="val-profit" style="color:var(--green)">0€</b><span style="font-size:9px; color:#666;">PROFITTO</span></div>
    </div>

    <div id="home" class="page active">
        
        <h2>MODELLI FISSI</h2>
        <div class="grid" id="grid-fixed"></div>

        <h2>I TUOI ARTICOLI</h2>
        <div class="grid" id="grid-user"></div>
        
        <div class="btn-add" onclick="aggiungi()">+ AGGIUNGI ARTICOLO PERSONALE</div>
    </div>

    <div id="history" class="page"><h2>STORICO VENDITE</h2><div id="list-history"></div></div>
    <div id="goal" class="page"><h2>OBIETTIVI</h2><p id="txt-goal"></p></div>

    <div id="menu">
        <div onclick="toggleMenu()" style="font-size:30px; margin-bottom:30px;">×</div>
        <a href="#" class="nav-link" onclick="vaiA('home')">HOME</a>
        <a href="#" class="nav-link" onclick="vaiA('history')">STORICO</a>
        <button onclick="localStorage.clear(); location.reload();" style="background:none; border:none; color:red; margin-top:50px;">RESET CACHE</button>
    </div>

    <script>
        // MODELLI RICHIESTI (NON OCCUPANO SPAZIO IN MEMORIA)
        const MODELLI_FISSI = [
            { n: "LV SKATE", p: 100, l: 900 },
            { n: "NUMERIS", p: 50, l: 200 },
            { n: "GOLDEN GOOSE", p: 70, l: 400 },
            { n: "NOCTA", p: 40, l: 180 },
            { n: "OFF WHITE OOF", p: 80, l: 350 },
            { n: "CAMPUS", p: 30, l: 110 },
            { n: "DUNK SB", p: 40, l: 150 }
        ];

        const KEY = 'KZL_FINAL_V2';
        let dati = JSON.parse(localStorage.getItem(KEY)) || { userScarpe: [], vendite: [] };

        function vaiA(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            toggleMenu();
            if(id === 'history') renderHistory();
        }

        function toggleMenu() { document.getElementById('menu').classList.toggle('open'); }

        function salva() {
            localStorage.setItem(KEY, JSON.stringify(dati));
            render();
        }

        function vendi(nome, lordo, profitto) {
            dati.vendite.push({ n: nome, l: lordo, p: profitto, d: new Date().toLocaleDateString() });
            salva();
            alert("VENDUTO: " + nome);
        }

        function aggiungi() {
            let n = prompt("Nome:"); if(!n) return;
            let l = prompt("Lordo:");
            let p = prompt("Profitto:");
            dati.userScarpe.push({ id: Date.now(), n, l: parseFloat(l), p: parseFloat(p), img: "" });
            salva();
        }

        function render() {
            // Render Modelli Fissi
            document.getElementById('grid-fixed').innerHTML = MODELLI_FISSI.map(s => `
                <div class="card" onclick="vendi('${s.n}', ${s.l}, ${s.p})">
                    <div style="height:110px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:10px; color:#444;">LOGO KZL</div>
                    <div class="card-info"><b>${s.n}</b><span style="color:var(--green)">+${s.p}€</span></div>
                </div>
            `).join('');

            // Render Modelli Utente (quelli con foto)
            document.getElementById('grid-user').innerHTML = dati.userScarpe.map(s => `
                <div class="card">
                    <div class="del" onclick="dati.userScarpe=dati.userScarpe.filter(x=>x.id!=${s.id}); salva();">×</div>
                    <div onclick="vendi('${s.n}', ${s.l}, ${s.p})">
                        <div style="height:110px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:10px; color:#444;">CUSTOM</div>
                        <div class="card-info"><b>${s.n}</b><span style="color:var(--green)">+${s.p}€</span></div>
                    </div>
                </div>
            `).join('');

            let tL = dati.vendite.reduce((a,b) => a + b.l, 0);
            let tP = dati.vendite.reduce((a,b) => a + b.p, 0);
            document.getElementById('val-lordo').innerText = tL + "€";
            document.getElementById('val-profit').innerText = tP + "€";
        }

        function renderHistory() {
            document.getElementById('list-history').innerHTML = dati.vendite.slice().reverse().map(v => `
                <div style="background:#111; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; border:1px solid #222;">
                    <span><b>${v.n}</b><br><small>${v.d}</small></span>
                    <b style="color:var(--green)">+${v.p}€</b>
                </div>
            `).join('');
        }

        render();
    </script>
</body>
</html>
