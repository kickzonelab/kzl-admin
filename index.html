<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KZL ADMIN</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; padding: env(safe-area-inset-top) 15px 30px 15px; }

        .logo-header { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; margin-top: 10px; }
        .logo-header img { width: 25px; height: 25px; border-radius: 6px; border: 1px solid var(--accent); }
        .logo-header h1 { font-family: 'Montserrat'; font-size: 12px; letter-spacing: 2px; margin: 0; }

        /* Barra compatta */
        .top-bar {
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid #222; border-radius: 50px; display: flex; justify-content: space-around;
            padding: 8px 15px; margin-bottom: 15px;
        }
        .mini-stat { text-align: center; }
        .mini-stat b { display: block; font-size: 16px; color: var(--accent); }
        .mini-stat span { font-size: 8px; color: #666; text-transform: uppercase; }

        /* Area Grafico */
        .chart-container {
            background: var(--card); border: 1px solid #222; border-radius: 20px;
            padding: 15px; margin-bottom: 20px; height: 180px;
        }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--card); border: 1px solid #252525; padding: 15px 10px; border-radius: 18px; text-align: center; }
        .btn:active { transform: scale(0.95); background: #1a1a1a; border-color: var(--accent); }
        .btn b { display: block; font-size: 13px; margin-bottom: 2px; }
        .btn span { font-size: 9px; color: var(--green); }

        #history { margin-top: 20px; background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid #1a1a1a; }
        .h-title { font-size: 10px; color: #444; text-transform: uppercase; margin-bottom: 10px; }
        .h-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 12px; }
        .h-pf { color: var(--green); font-weight: 700; }
    </style>
</head>
<body>

    <div class="logo-header">
        <img src="logo.png" alt="L">
        <h1>KICKZONELAB</h1>
    </div>

    <div class="top-bar">
        <div class="mini-stat"><b><span id="valLordo">0</span>€</b><span>Lordo</span></div>
        <div class="mini-stat"><b><span id="valProfit" style="color: var(--green);">0</span>€</b><span>Profitto</span></div>
    </div>

    <div class="chart-container">
        <canvas id="profitChart"></canvas>
    </div>

        <div class="btn" onclick="addS('McQueen', 130, 50)"><b>McQueen</b><span>Base +50€</span></div>
        <div class="btn" onclick="addS('Travis Scott', 1100, 300)"><b>Travis Scott</b><span>Base +300€</span></div>
