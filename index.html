<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KICKZONE">
    
    <link rel="apple-touch-icon" href="logo.png">
    
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            color: white; 
            padding: calc(env(safe-area-inset-top) + 20px) 15px 100px 15px; 
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px;
        }
        .header h1 { font-family: 'Montserrat'; font-size: 15px; letter-spacing: 2px; }
        
        .refresh-btn {
            font-size: 10px;
            background: var(--accent);
            color: #000;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: bold;
        }

        .top-stats { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 18px 10px; text-align: center; }
        .stat-box b { display: block; font-size: 22px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; font-weight: 800; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 20px; text-align: center; overflow: hidden; padding-bottom: 12px; width: 100%; }
        .btn img { width: 100%; height: 110px; object-fit: cover; border-bottom: 1px solid #222; background: #1a1a1a; }
        .btn b { display: block; font-size: 12px; padding: 10px 5px 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }
        
        .edit-badge { 
            position: absolute; top: 8px; right: 8px; background: var(--accent); color: #000; 
            border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; z-index: 10; font-weight: bold; border: 2px solid #000; 
        }

        .btn.special { 
            grid-column: span 2; 
            background: linear-gradient(145deg, #111, #050505);
            border: 1px dashed var(--accent); 
            padding: 25px; 
            margin-top: 15px; 
            border-radius: 20px; 
            color: var(--accent); 
            text-align: center; 
            font-weight: bold;
        }

        .page { display: none; }
        .active { display: block; }

        #nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(10, 10, 10, 0.8); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-around; 
            padding: 20px 10px calc(20px + env(safe-area-inset-bottom)) 10px; 
            border-top: 1px solid #222; 
            z-index: 100; 
        }
        .nav-item { font-size: 11px; color: #555; text-decoration: none; font-weight: bold; }
        .nav-item.active-nav { color: var(--accent); }

        /* Stile Storico */
        .hist-card { background: #121212; padding: 15px; border-radius: 18px; margin-bottom: 12px; display: flex; align-items: center; border: 1px solid #222; }
        .hist-card img { width: 45px; height: 45px; border-radius: 10px; object-fit: cover; margin-right: 15px; }
        .hist-price { color: var(--green); font-weight: bold; }

        /* Tasti Sync in fondo */
        .sync-area { margin-top: 50px; text-align: center; padding-bottom: 20px; display: flex; gap: 10px; justify-content: center; }
        .sync-btn { font-size: 10px; padding: 8px 15px; border-radius: 10px; border: 1px solid #333; color: #666; background: #050505; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="refresh-btn" onclick="hardRefresh()">REFRESH ↻</div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="btn special" onclick="addArticle()">➕ AGGIUNGI ARTICOLO</div>
        
        <div class="sync-area">
            <div class="sync-btn" onclick="exportDB()">📤 ESPORTA MEMORIA (da Mac)</div>
            <div class="sync-btn" onclick="importDB()">📥 IMPORTA MEMORIA (su Tel)</div>
        </div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size:16px; margin-bottom:20px; font-family:'Montserrat';">STORICO</h2>
        <div id="historyContent"></div>
    </div>

    <nav id="nav">
        <a href="#" class="nav-item active-nav" id="n-home" onclick="showP('home')">HOME</a>
        <a href="#" class="nav-item" id="n-history" onclick="showP('history')">STORICO</a>
    </nav>

    <script>
        const KEY = 'KZL_MASTER_V3';
        const DEFAULT_IMG = "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=200&auto=format&fit=crop";

        let db = JSON.parse(localStorage.getItem(KEY)) || {
            items: [{ id: 1, name: 'Jordan 4 Black', l: 350, p: 100, img: DEFAULT_IMG }],
            sales: []
        };

        function hardRefresh() {
            window.location.href = window.location.pathname + '?v=' + new Date().getTime();
        }

        function save() {
            localStorage.setItem(KEY, JSON.stringify(db));
            renderHome();
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById('p-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active-nav');
            if(id === 'history') renderHistory();
            window.scrollTo(0,0);
        }

        function addArticle() {
            let name = prompt("Nome Modello:");
            if(!name) return;
            let l = prompt("Lordo (€):", "300");
            let p = prompt("Profitto (€):", "100");
            
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let max_size = 400; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: canvas.toDataURL('image/jpeg', 0.6) });
                        save();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function editItem(id) {
            let i = db.items.find(x => x.id === id);
            let n = prompt("Modifica Nome:", i.name);
            if(!n) return;
            i.name = n;
            i.l = parseFloat(prompt("Lordo (€):", i.l));
            i.p = parseFloat(prompt("Profitto (€):", i.p));
            save();
        }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            let cl = prompt("Cliente:");
            if(!cl) return;
            db.sales.push({ name: i.name, cl, p: i.p, l: i.l, img: i.img, d: new Date().toLocaleDateString('it-IT') });
            save();
            alert("Vendita salvata!");
        }

        function renderHome() {
            let html = "";
            db.items.forEach(i => {
                html += `
                <div class="btn-wrap">
                    <div class="edit-badge" onclick="editProductPhoto(${i.id})">📸</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span>+${i.p}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            updateStats();
        }
        
        // Modifica rapida solo foto
        function editProductPhoto(id) {
            let i = db.items.find(x => x.id === id);
            if(!confirm("Vuoi cambiare la foto a "+i.name+"?")) {
                editItem(id); // Se annulla foto, apre modifica testo
                return;
            }
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let max_size = 400; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        i.img = canvas.toDataURL('image/jpeg', 0.6);
                        save();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function updateStats() {
            let tL = db.sales.reduce((a, b) => a + (b.l || 0), 0);
            let tP = db.sales.reduce((a, b) => a + (b.p || 0), 0);
            document.getElementById('tLordo').innerText = tL + "€";
            document.getElementById('tProfit').innerText = tP + "€";
        }

        function renderHistory() {
            let html = "";
            db.sales.slice().reverse().forEach(s => {
                html += `<div class="hist-card">
                    <img src="${s.img}">
                    <div style="flex:1"><b>${s.cl}</b><br><small style="color:#666">${s.name} • ${s.d}</small></div>
                    <div style="color:var(--green); font-weight:bold;">+${s.p}€</div>
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "<p style='text-align:center; color:#333;'>Nessuna vendita</p>";
        }

        // --- FUNZIONI DI SINCRONIZZAZIONE ---
        function exportDB() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let downNode = document.createElement('a');
            downNode.setAttribute("href", dataStr);
            downNode.setAttribute("download", "kickzone_backup_" + new Date().toLocaleDateString('it-IT') + ".json");
            document.body.appendChild(downNode);
            downNode.click();
            downNode.remove();
        }

        function importDB() {
            if(!confirm("Stai per sovrascrivere la memoria del telefono con il file del Mac. Procedere?")) return;
            let input = document.createElement('input');
            input.type = 'file'; input.accept = '.json';
            input.onchange = e => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        db = JSON.parse(ev.target.result);
                        save();
                        alert("Sincronizzazione completata! Dati aggiornati.");
                    } catch(err) {
                        alert("File non valido.");
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        renderHome();
    </script>
</body>
</html>
