<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: rgba(255,255,255,0.07); --green: #00ff88; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #000; 
            color: white; 
            transition: background 0.5s ease;
            min-height: 100vh;
            padding: calc(env(safe-area-inset-top) + 20px) 15px 100px 15px; 
        }

        body.bg-home { background: #000; }
        body.bg-goal { background: radial-gradient(circle at top right, #001a2e, #000); }
        body.bg-improve { background: radial-gradient(circle at top right, #1a002e, #000); }
        body.bg-history { background: radial-gradient(circle at top right, #1a1a1a, #000); }

        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: 0.8s; }
        #splash img { width: 110px; animation: pulse 2s infinite; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; height: 40px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 2px; }
        .menu-icon { width: 30px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; position: relative; z-index: 1001; }
        .menu-icon span { display: block; height: 3px; width: 100%; background: var(--accent); border-radius: 3px; }

        /* STATS */
        #top-stats { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 18px 5px; text-align: center; backdrop-filter: blur(10px); }
        .stat-box b { display: block; font-size: 20px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #888; font-weight: 800; }

        /* SIDE MENU */
        #side-menu { position: fixed; top: 0; right: -100%; width: 85%; height: 100%; background: rgba(0,0,0,0.98); backdrop-filter: blur(20px); z-index: 1000; transition: 0.4s; padding: 80px 40px; border-left: 1px solid #222; }
        #side-menu.open { right: 0; }
        .menu-link { display: block; color: white; font-size: 22px; font-weight: bold; margin-bottom: 30px; text-decoration: none; font-family: 'Montserrat'; opacity: 0.6; }
        .menu-link.active { color: var(--accent); opacity: 1; }

        /* GRID HOME - FIX VISUALIZZAZIONE */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            width: 100%;
            padding-bottom: 20px;
        }
        .btn-wrap { position: relative; width: 100%; }
        .btn { 
            background: var(--card); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 22px; 
            text-align: center; 
            overflow: hidden; 
            padding-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .btn img { width: 100%; height: 110px; object-fit: contain; padding: 10px; background: rgba(255,255,255,0.03); }
        .btn b { font-size: 11px; padding: 8px 4px 2px; text-transform: uppercase; width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .del-item { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid #000; z-index: 10; }

        /* SEZIONI */
        .page { display: none; animation: fadeIn 0.4s ease; }
        .page.active { display: block; }
        h2 { font-family: 'Montserrat'; font-size: 24px; margin-bottom: 20px; }

        .add-btn { background: var(--accent); color: #000; padding: 18px; border-radius: 20px; text-align: center; font-weight: 800; font-size: 14px; margin-top: 10px; font-family: 'Montserrat'; }
        
        /* TODO LIST */
        .todo-item { background: var(--card); padding: 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        .checkbox { width: 26px; height: 26px; border: 2px solid var(--accent); border-radius: 50%; flex-shrink: 0; }
        .todo-item.done { border-color: var(--green); opacity: 0.6; }
        .todo-item.done .checkbox { background: var(--green); border-color: var(--green); position: relative; }
        .todo-item.done .checkbox::after { content: '✓'; color: #000; position: absolute; left: 5px; top: 0px; font-weight: bold; }
        .todo-item.done span { text-decoration: line-through; }

        /* GOAL */
        .goal-container { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; padding: 30px 20px; text-align: center; }
        .goal-bar { width: 100%; height: 14px; background: rgba(0,0,0,0.3); border-radius: 10px; margin: 20px 0; overflow: hidden; border: 1px solid #333; }
        #progress { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: 1s; }

        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-home">

    <div id="splash">
        <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2742/2742674.png'">
        <div id="quote" style="font-family:'Montserrat'; font-size:12px; color:var(--accent); text-align:center; margin-top:20px; padding:0 30px; text-transform:uppercase;">DIVENTA COSÌ RICCO DA NON DOVER PIÙ GUARDARE IL PREZZO</div>
    </div>

    <div id="side-menu">
        <div class="close-menu" onclick="toggleMenu()" style="position:absolute; top:20px; right:20px; font-size:30px;">×</div>
        <a href="#" class="menu-link active" onclick="showPage('home')">HOME</a>
        <a href="#" class="menu-link" onclick="showPage('history')">STORICO</a>
        <a href="#" class="menu-link" onclick="showPage('goal')">OBIETTIVI</a>
        <a href="#" class="menu-link" onclick="showPage('improve')">AZIENDA</a>
        <button onclick="exportDB()" style="margin-top:40px; background:none; border:1px solid #333; color:#666; padding:10px; border-radius:10px; width:100%; font-size:10px;">BACKUP DATI</button>
    </div>

    <div class="header">
        <h1 id="page-title">KICKZONELAB</h1>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div id="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="add-btn" style="background:none; border: 2px dashed var(--accent); color: var(--accent); margin-top:30px;" onclick="addArticle()">+ AGGIUNGI ARTICOLO</div>
        <button onclick="location.reload()" style="background:none; border:none; color:#333; width:100%; margin-top:20px; font-size:10px;">REFRESH APP</button>
    </div>

    <div id="p-goal" class="page">
        <h2>OBIETTIVI</h2>
        <div class="goal-container">
            <p style="color:#888; font-size:12px;">TARGET PROFITTO: 1.500€</p>
            <div class="goal-bar"><div id="progress"></div></div>
            <p id="goalText" style="font-family:'Montserrat'; color:var(--accent);"></p>
        </div>
    </div>

    <div id="p-improve" class="page">
        <h2>AZIENDA</h2>
        <div id="improveList"></div>
        <div class="add-btn" onclick="addImprovement()">+ AGGIUNGI OBIETTIVO</div>
    </div>

    <div id="p-history" class="page">
        <h2>STORICO</h2>
        <div id="historyContent"></div>
    </div>

    <script>
        const KEY = 'KZL_FIX_V10';
        let db = JSON.parse(localStorage.getItem(KEY)) || { items: [], sales: [], improvements: [] };

        window.onload = () => {
            setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(()=> document.getElementById('splash').style.display='none', 600); }, 2200);
            renderHome();
        };

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

        function showPage(id) {
            document.body.className = 'bg-' + id;
            document.getElementById('top-stats').style.display = (id === 'home') ? 'flex' : 'none';
            document.getElementById('page-title').innerText = (id === 'home') ? 'KICKZONELAB' : id.toUpperCase();
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            if(id==='goal') updateGoal();
            if(id==='improve') renderImprovements();
            if(id==='history') renderHistory();
            toggleMenu();
        }

        function save() { localStorage.setItem(KEY, JSON.stringify(db)); renderHome(); }

        function addArticle() {
            let name = prompt("Nome:"); if(!name) return;
            let l = prompt("Lordo:"); let p = prompt("Profitto:");
            let input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let r = new FileReader();
                r.onload = ev => {
                    // COMPRESSIONE IMMAGINE PER NON BLOCCARE L'APP
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let ctx = canvas.getContext('2d');
                        let w = 400; let h = img.height * (400 / img.width);
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: canvas.toDataURL('image/jpeg', 0.7) });
                        save();
                    };
                    img.src = ev.target.result;
                };
                r.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function renderHome() {
            let grid = document.getElementById('mainGrid');
            grid.innerHTML = ""; // Pulisci prima di renderizzare
            db.items.forEach(i => {
                let div = document.createElement('div');
                div.className = "btn-wrap";
                div.innerHTML = `
                    <div class="del-item" onclick="deleteItem(${i.id})">×</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span style="color:var(--green); font-size:12px; font-weight:bold;">+${i.p}€</span>
                    </div>`;
                grid.appendChild(div);
            });
            updateStats();
        }

        function deleteItem(id) { if(confirm("Eliminare?")) { db.items = db.items.filter(x=>x.id!==id); save(); } }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            db.sales.push({ name: i.name, p: i.p, l: i.l, d: new Date().toLocaleDateString(), img: i.img });
            save(); alert("VENDUTO!");
        }

        function updateStats() {
            let tL = db.sales.reduce((a,b)=> a+(b.l||0), 0);
            let tP = db.sales.reduce((a,b)=> a+(b.p||0), 0);
            document.getElementById('tLordo').innerText = tL+"€";
            document.getElementById('tProfit').innerText = tP+"€";
        }

        function updateGoal() {
            let target = 1500;
            let current = db.sales.reduce((a,b)=> a+(b.p||0), 0);
            let perc = Math.min((current / target) * 100, 100);
            document.getElementById('progress').style.width = perc + "%";
            document.getElementById('goalText').innerText = current + "€ / " + target + "€ (" + Math.floor(perc) + "%)";
        }

        function addImprovement() {
            let t = prompt("Nuovo obiettivo:");
            if(t) { db.improvements.push({ text: t, done: false }); save(); renderImprovements(); }
        }

        function renderImprovements() {
            document.getElementById('improveList').innerHTML = db.improvements.map((t, i) => `
                <div class="todo-item ${t.done ? 'done' : ''}" onclick="db.improvements[${i}].done=!db.improvements[${i}].done; save(); renderImprovements();">
                    <div class="checkbox"></div>
                    <span style="flex:1;">${t.text}</span>
                    <div onclick="event.stopPropagation(); db.improvements.splice(${i},1); save(); renderImprovements();" style="color:var(--red);">×</div>
                </div>
            `).join('') || "<p style='text-align:center; color:#333;'>Nessun obiettivo.</p>";
        }

        function renderHistory() {
            document.getElementById('historyContent').innerHTML = db.sales.slice().reverse().map(s => `
                <div class="todo-item" style="opacity:1">
                    <img src="${s.img}" style="width:40px; height:40px; object-fit:cover; border-radius:5px;">
                    <div style="flex:1"><b>${s.name}</b><br><small style="color:#555;">${s.d}</small></div>
                    <b style="color:var(--green)">+${s.p}€</b>
                </div>
            `).join('') || "<p style='text-align:center; color:#333;'>Vuoto.</p>";
        }

        function exportDB() { 
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let a = document.createElement('a'); a.href = dataStr; a.download = "kzl_backup.json"; a.click();
        }
    </script>
</body>
</html>
