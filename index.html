<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: env(safe-area-inset-top) 15px 30px 15px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 2px; }
        
        .menu-btn { width: 30px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1001; }
        .menu-btn span { display: block; height: 3px; width: 100%; background: var(--accent); border-radius: 3px; }

        /* MENU LATERALE */
        .side-menu { position: fixed; top: 0; right: -100%; width: 75%; height: 100%; background: #111; z-index: 1000; padding: 80px 25px; transition: 0.4s; border-left: 1px solid #222; }
        .side-menu.open { right: 0; }
        .menu-link { display: block; color: white; font-size: 16px; margin-bottom: 25px; text-decoration: none; text-transform: uppercase; font-weight: 600; }

        /* BADGE E OBIETTIVO */
        .status-area { text-align: center; margin-bottom: 20px; }
        #userBadge { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 50px; background: #111; color: var(--accent); border: 1px solid var(--accent); text-transform: uppercase; margin-bottom: 10px; display: inline-block; }
        
        .goal-container { background: #1a1a1a; border-radius: 10px; height: 22px; width: 100%; position: relative; overflow: hidden; border: 1px solid #333; }
        .goal-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: 1s ease; }
        .goal-text { position: absolute; width: 100%; text-align: center; font-size: 9px; font-weight: 700; line-height: 20px; color: white; mix-blend-mode: difference; }

        /* TOTALI */
        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 18px; padding: 12px; text-align: center; }
        .stat-box b { display: block; font-size: 18px; color: var(--accent); }
        .stat-box span { font-size: 8px; color: #666; text-transform: uppercase; }

        /* PAGINE */
        .page { display: none; }
        .active { display: block; }

        /* GRIGLIA */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { background: var(--card); border: 1px solid #222; padding: 22px 10px; border-radius: 22px; text-align: center; }
        .btn:active { transform: scale(0.95); border-color: var(--accent); }
        .btn b { display: block; font-size: 14px; margin-bottom: 4px; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }

        /* LISTE E RANKING */
        .list-box { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #222; }
        .row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .winner { color: gold; font-weight: bold; text-shadow: 0 0 5px rgba(255,215,0,0.3); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="status-area">
        <span id="userBadge">RESELLER JUNIOR</span>
        <div class="goal-container">
            <div class="goal-bar" id="goalBar"></div>
            <div class="goal-text">Obiettivo 1500€: <span id="goalPercent">0%</span></div>
        </div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>Lordo</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>Profitto</span></div>
    </div>

    <div class="side-menu" id="sideMenu">
        <a href="#" class="menu-link" onclick="showP('home')">🏠 Vendita</a>
        <a href="#" class="menu-link" onclick="showP('rank')">🏆 Articolo del Mese</a>
        <a href="#" class="menu-link" onclick="showP('months')">📅 Riassunto Mesi</a>
        <a href="#" class="menu-link" onclick="exportData()">📥 Esporta Dati (Excel)</a>
        <a href="#" class="menu-link" style="color:red; font-size:10px; margin-top:50px" onclick="clearAll()">RESET TOTALE</a>
    </div>

    <!-- PAGINA VENDITA -->
    <div id="p-home" class="page active">
        <div class="grid">
            <div class="btn" onclick="addS('Jordan 4', 350, 100)"><b>Jordan 4</b><span>+100€</span></div>
            <div class="btn" onclick="addS('McQueen', 130, 50)"><b>McQueen</b><span>+50€</span></div>
            <div class="btn" onclick="addS('Travis Scott', 1100, 300)"><b>Travis Scott</b><span>+300€</span></div>
            <div class="btn" onclick="addS('Dunk Low', 180, 60)"><b>Dunk Low</b><span>+60€</span></div>
            <div class="btn" onclick="addS('Campus', 120, 40)"><b>Campus</b><span>+40€</span></div>
            <div class="btn" onclick="addS('Yeezy 350', 250, 80)"><b>Yeezy 350</b><span>+80€</span></div>
        </div>
    </div>

    <!-- PAGINA ARTICOLO DEL MESE (GARA) -->
    <div id="p-rank" class="page">
        <h2 style="font-size:12px; color:#555; margin-bottom:15px; text-transform:uppercase">🏆 Classifica Vendite</h2>
        <div class="list-box" id="rankContent"></div>
    </div>

    <!-- PAGINA MESI -->
    <div id="p-months" class="page">
        <h2 style="font-size:12px; color:#555; margin-bottom:15px; text-transform:uppercase">📅 Performance Mensile</h2>
        <div class="list-box" id="monthContent"></div>
    </div>

    <script>
        let sales = JSON.parse(localStorage.getItem('kzl_final_data')) || [];
        const GOAL = 1500;

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').style.display = document.getElementById('sideMenu').classList.contains('open') ? 'block' : 'none';
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            toggleMenu();
            if(id === 'rank') updateRank();
            if(id === 'months') updateMonths();
        }

        function addS(shoe, lordo, pDef) {
            let cl = prompt("Nome Cliente:");
            if(!cl) return;
            let p = prompt("Conferma Profitto:", pDef);
            if(p === null) return;
            p = parseFloat(p);

            sales.push({ shoe, cl, lordo, p, date: new Date().toISOString() });
            localStorage.setItem('kzl_final_data', JSON.stringify(sales));
            updateUI();
        }

        function updateUI() {
            let totalL = sales.reduce((a, b) => a + b.lordo, 0);
            let totalP = sales.reduce((a, b) => a + b.p, 0);
            
            document.getElementById('tLordo').innerText = totalL + "€";
            document.getElementById('tProfit').innerText = totalP + "€";

            let percent = Math.min((totalP / GOAL) * 100, 100);
            document.getElementById('goalBar').style.width = percent + "%";
            document.getElementById('goalPercent').innerText = Math.round(percent) + "%";

            let badge = "RESELLER JUNIOR";
            if(totalP > 500) badge = "PLUG ESPERTO";
            if(totalP >= 1500) badge = "KING OF THE LAB 👑";
            document.getElementById('userBadge').innerText = badge;
        }

        function updateRank() {
            let counts = {};
            sales.forEach(s => counts[s.shoe] = (counts[s.shoe] || 0) + 1);
            let sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
            
            let html = "";
            sorted.forEach((item, i) => {
                html += `<div class="row ${i===0?'winner':''}">
                    <span>${i+1}. ${item[0]}</span>
                    <b>${item[1]} Paia</b>
                </div>`;
            });
            document.getElementById('rankContent').innerHTML = html || "Vendi la prima scarpa!";
        }

        function updateMonths() {
            let mData = {};
            sales.forEach(s => {
                let m = new Date(s.date).toLocaleString('it-IT', { month: 'long', year: 'numeric' });
                if(!mData[m]) mData[m] = 0;
                mData[m] += s.p;
            });
            let html = "";
            for(let m in mData) {
                html += `<div class="row"><span style="text-transform:capitalize">${m}</span><b style="color:var(--green)">+${mData[m]}€</b></div>`;
            }
            document.getElementById('monthContent').innerHTML = html || "Nessun dato mensile.";
        }

        function exportData() {
            let csv = "Data,Cliente,Scarpa,Lordo,Profitto\n";
            sales.forEach(s => csv += `${new Date(s.date).toLocaleDateString()},${s.cl},${s.shoe},${s.lordo},${s.p}\n`);
            let blob = new Blob([csv], { type: 'text/csv' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Report_KICKZONELAB.csv';
            a.click();
        }

        function clearAll() { if(confirm("CANCELLARE TUTTO?")) { localStorage.clear(); location.reload(); } }

        updateUI();
    </script>
</body>
</html>
