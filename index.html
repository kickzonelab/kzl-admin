<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: 20px 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 2px; }

        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 12px; text-align: center; }
        .stat-box b { display: block; font-size: 18px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 15px; text-align: center; overflow: hidden; padding-bottom: 10px; width: 100%; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        .btn img { width: 100%; height: 100px; object-fit: cover; border-bottom: 1px solid #222; background: #1a1a1a; }
        .btn b { display: block; font-size: 12px; padding: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }
        
        .edit-badge { 
            position: absolute; top: 5px; right: 5px; background: var(--accent); color: #000; 
            border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; 
            justify-content: center; font-size: 12px; z-index: 10; font-weight: bold;
        }

        .btn.special { grid-column: span 2; background: #111; border: 1px dashed var(--accent); padding: 20px; margin-top: 10px; border-radius: 15px; }
        
        .page { display: none; }
        .active { display: block; }

        #menu { position: fixed; bottom: 0; left: 0; width: 100%; background: #080808; display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; z-index: 100; }
        .menu-item { font-size: 10px; color: #666; text-decoration: none; text-align: center; }
        .menu-item.active-link { color: var(--accent); }
    </style>
</head>
<body>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div style="color: var(--accent); font-size: 10px;" onclick="location.reload()">REFRESH ↻</div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="btn special" onclick="editProduct(null)">
            <b>➕ AGGIUNGI ARTICOLO</b><br>
            <small style="color:var(--accent); font-size: 9px;">Verrà salvato qui in Home</small>
        </div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size: 14px; margin-bottom: 10px;">STORICO VENDITE</h2>
        <div id="historyContent"></div>
    </div>

    <div id="menu">
        <a href="#" class="menu-item active-link" id="l-home" onclick="showP('home')">HOME</a>
        <a href="#" class="menu-item" id="l-history" onclick="showP('history')">STORICO</a>
        <a href="#" class="menu-item" onclick="localStorage.clear(); location.reload();" style="color: red;">RESET</a>
    </div>

    <script>
        // Database unificato per evitare perdite
        const DB_KEY = 'KICKZONE_DATA_FINAL';
        const IMG_DEFAULT = "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=200&auto=format&fit=crop";

        let storage = JSON.parse(localStorage.getItem(DB_KEY)) || {
            products: [
                { id: 1, name: 'Jordan 4', lordo: 350, profit: 100, img: IMG_DEFAULT },
                { id: 2, name: 'McQueen', lordo: 130, profit: 50, img: IMG_DEFAULT }
            ],
            sales: []
        };

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active-link'));
            document.getElementById('p-' + id).classList.add('active');
            document.getElementById('l-' + id).classList.add('active-link');
            if(id === 'history') updateHistory();
        }

        function editProduct(id) {
            let p = id ? storage.products.find(x => x.id === id) : { name: "", lordo: 0, profit: 0, img: IMG_DEFAULT };
            
            let name = prompt("Nome Modello:", p.name);
            if(!name) return;
            let lordo = prompt("Prezzo Vendita (€):", p.lordo);
            let profit = prompt("Profitto (€):", p.profit);

            if(confirm("Vuoi mettere una foto?")) {
                let input = document.createElement('input');
                input.type = 'file'; input.accept = 'image/*';
                input.onchange = e => {
                    let r = new FileReader();
                    r.onload = () => saveAndRender(id, name, lordo, profit, r.result);
                    r.readAsDataURL(e.target.files[0]);
                };
                input.click();
            } else {
                saveAndRender(id, name, lordo, profit, p.img);
            }
        }

        function saveAndRender(id, name, lordo, profit, img) {
            if(id) {
                let index = storage.products.findIndex(x => x.id === id);
                storage.products[index] = { id, name, lordo: parseFloat(lordo), profit: parseFloat(profit), img };
            } else {
                storage.products.push({ id: Date.now(), name, lordo: parseFloat(lordo), profit: parseFloat(profit), img });
            }
            saveToDisk();
            renderHome();
        }

        function saveToDisk() {
            localStorage.setItem(DB_KEY, JSON.stringify(storage));
        }

        function renderHome() {
            let html = "";
            storage.products.forEach(p => {
                html += `
                <div class="btn-wrap">
                    <div class="edit-badge" onclick="editProduct(${p.id})">✎</div>
                    <div class="btn" onclick="registerSale(${p.id})">
                        <img src="${p.img}">
                        <b>${p.name}</b>
                        <span>+${p.profit}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            updateUI();
        }

        function registerSale(prodId) {
            let p = storage.products.find(x => x.id === prodId);
            let cl = prompt("Nome Cliente per " + p.name + ":");
            if(!cl) return;
            
            storage.sales.push({ 
                name: p.name, 
                cl: cl, 
                p: p.profit, 
                l: p.lordo,
                img: p.img, 
                date: new Date().toLocaleDateString() 
            });
            saveToDisk();
            updateUI();
            alert("Vendita salvata!");
        }

        function updateUI() {
            let totalL = storage.sales.reduce((a, b) => a + b.l, 0);
            let totalP = storage.sales.reduce((a, b) => a + b.p, 0);
            document.getElementById('tLordo').innerText = totalL + "€";
            document.getElementById('tProfit').innerText = totalP + "€";
        }

        function updateHistory() {
            let html = "";
            storage.sales.slice().reverse().forEach(s => {
                html += `<div style="background:#121212; padding:10px; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; border:1px solid #222;">
                    <img src="${s.img}" style="width:40px; height:40px; border-radius:5px; object-fit:cover; margin-right:10px;">
                    <div style="flex:1"><b>${s.cl}</b><br><small style="color:#666">${s.name} - ${s.date}</small></div>
                    <b style="color:var(--green)">+${s.p}€</b>
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "Ancora nessuna vendita.";
        }

        // Avvio
        renderHome();
    </script>
</body>
</html>
