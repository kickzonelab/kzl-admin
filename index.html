<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KICKZONE">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: calc(env(safe-area-inset-top) + 20px) 15px 120px 15px; overflow-x: hidden; }

        /* ANIMAZIONE ENTRATA */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: 0.8s ease-out;
        }
        #splash img { width: 120px; animation: pulse 2s infinite; margin-bottom: 20px; }
        #quote { font-family: 'Montserrat'; font-size: 14px; text-align: center; color: var(--accent); padding: 0 30px; line-height: 1.4; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-family: 'Montserrat'; font-size: 15px; letter-spacing: 2px; }
        .refresh-btn { font-size: 10px; background: var(--accent); color: #000; padding: 8px 14px; border-radius: 10px; font-weight: bold; }

        /* STATS */
        .top-stats { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 18px 10px; text-align: center; }
        .stat-box b { display: block; font-size: 22px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; font-weight: 800; }

        /* GRID ARTICOLI */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 20px; text-align: center; overflow: hidden; padding-bottom: 12px; }
        .btn img { width: 100%; height: 110px; object-fit: contain; padding: 10px; background: #1a1a1a; }
        .btn b { display: block; font-size: 12px; padding: 8px 5px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }
        .edit-badge { position: absolute; top: 8px; right: 8px; background: var(--accent); color: #000; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 10; font-weight: bold; border: 2px solid #000; }

        .btn.special { grid-column: span 2; background: #111; border: 1px dashed var(--accent); padding: 25px; margin-top: 15px; border-radius: 20px; color: var(--accent); text-align: center; font-weight: bold; }

        /* CLASSIFICHE */
        .rank-item { background: var(--card); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .rank-name { font-weight: 600; font-size: 14px; }
        .rank-val { color: var(--accent); font-family: 'Montserrat'; }

        /* NAV */
        .page { display: none; }
        .active { display: block; }
        #nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 20px 10px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid #222; z-index: 100; }
        .nav-item { font-size: 10px; color: #555; text-decoration: none; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item.active-nav { color: var(--accent); }

        .sync-area { margin-top: 50px; text-align: center; padding-bottom: 20px; display: flex; gap: 10px; justify-content: center; }
        .sync-btn { font-size: 9px; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; color: #444; background: #050505; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2742/2742674.png'">
        <div id="quote">CARICAMENTO...</div>
    </div>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="refresh-btn" onclick="hardRefresh()">REFRESH ↻</div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="btn special" onclick="addArticle()">➕ AGGIUNGI ARTICOLO</div>
        <div class="sync-area">
            <div class="sync-btn" onclick="exportDB()">📤 EXPORT (MAC)</div>
            <div class="sync-btn" onclick="importDB()">📥 IMPORT (TEL)</div>
        </div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size:16px; margin-bottom:20px; font-family:'Montserrat';">STORICO VENDITE</h2>
        <div id="historyContent"></div>
    </div>

    <div id="p-stats" class="page">
        <h2 style="font-size:16px; margin-bottom:20px; font-family:'Montserrat';">CLASSIFICHE</h2>
        <h3 style="font-size:11px; color:#666; margin-bottom:10px;">TOP CLIENTI</h3>
        <div id="topClients"></div>
        <h3 style="font-size:11px; color:#666; margin-top:20px; margin-bottom:10px;">MODELLI PIÙ VENDUTI</h3>
        <div id="topModels"></div>
    </div>

    <nav id="nav">
        <a href="#" class="nav-item active-nav" id="n-home" onclick="showP('home')">HOME</a>
        <a href="#" class="nav-item" id="n-history" onclick="showP('history')">STORICO</a>
        <a href="#" class="nav-item" id="n-stats" onclick="showP('stats')">RANK</a>
    </nav>

    <script>
        const KEY = 'KZL_FINAL_STORAGE_V4';
        const quotes = [
            "SOLO CHI RISCHIA DI ANDARE TROPPO LONTANO PUÒ SCOPRIRE FINO A DOVE SI PUÒ ANDARE.",
            "NON CONTA LA SCARPA, MA IL PASSO DI CHI LA INDOSSA.",
            "IL SUCCESSO NON È DEFINITIVO, IL FALLIMENTO NON È FATALE: CIÒ CHE CONTA È IL CORAGGIO DI CONTINUARE.",
            "LAVORA IN SILENZIO, LASCIA CHE SIA IL TUO SUCCESSO A FARE RUMORE.",
            "OGNI VENDITA È UN PASSO VERSO L'IMPERO.",
            "NON FERMARTI QUANDO SEI STANCO, FERMATI QUANDO HAI FINITO.",
            "KICKZONELAB: IL FUTURO È AI TUOI PIEDI."
        ];

        let db = JSON.parse(localStorage.getItem(KEY)) || { items: [], sales: [] };

        // SPLASH SCREEN
        window.onload = () => {
            const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
            document.getElementById('quote').innerText = quotes[dayOfYear % quotes.length];
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
            }, 2500);
            renderHome();
        };

        function hardRefresh() { window.location.href = window.location.pathname + '?v=' + new Date().getTime(); }
        function save() { localStorage.setItem(KEY, JSON.stringify(db)); renderHome(); }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById('p-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active-nav');
            if(id === 'history') renderHistory();
            if(id === 'stats') renderRankings();
            window.scrollTo(0,0);
        }

        function addArticle() {
            let name = prompt("Nome Modello:");
            if(!name) return;
            let l = prompt("Lordo (€):", "300");
            let p = prompt("Profitto (€):", "100");
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let max_size = 400; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: canvas.toDataURL('image/jpeg', 0.7) });
                        save();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            let cl = prompt("Nome Cliente:");
            if(!cl) return;
            db.sales.push({ name: i.name, cl, p: i.p, l: i.l, img: i.img, d: new Date().toLocaleDateString('it-IT') });
            save();
            alert("VENDITA REGISTRATA!");
        }

        function renderHome() {
            let html = "";
            db.items.forEach(i => {
                html += `<div class="btn-wrap">
                    <div class="edit-badge" onclick="event.stopPropagation(); deleteItem(${i.id})">×</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span>+${i.p}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            updateStats();
        }

        function deleteItem(id) { if(confirm("Eliminare articolo?")) { db.items = db.items.filter(x => x.id !== id); save(); } }

        function updateStats() {
            let tL = db.sales.reduce((a, b) => a + (b.l || 0), 0);
            let tP = db.sales.reduce((a, b) => a + (b.p || 0), 0);
            document.getElementById('tLordo').innerText = tL + "€";
            document.getElementById('tProfit').innerText = tP + "€";
        }

        function renderHistory() {
            let html = "";
            db.sales.slice().reverse().forEach(s => {
                html += `<div class="rank-item">
                    <img src="${s.img}" style="width:35px; height:35px; border-radius:5px; object-fit:cover; margin-right:10px;">
                    <div style="flex:1"><b class="rank-name">${s.cl}</b><br><small style="color:#666">${s.name}</small></div>
                    <b style="color:var(--green)">+${s.p}€</b>
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "Nessuna vendita.";
        }

        function renderRankings() {
            let clients = {}; let models = {};
            db.sales.forEach(s => {
                clients[s.cl] = (clients[s.cl] || 0) + 1;
                models[s.name] = (models[s.name] || 0) + 1;
            });
            
            let sortC = Object.entries(clients).sort((a,b) => b[1] - a[1]);
            let sortM = Object.entries(models).sort((a,b) => b[1] - a[1]);

            document.getElementById('topClients').innerHTML = sortC.map(c => `<div class="rank-item"><span class="rank-name">${c[0]}</span><span class="rank-val">${c[1]} ACQUISTI</span></div>`).join('');
            document.getElementById('topModels').innerHTML = sortM.map(m => `<div class="rank-item"><span class="rank-name">${m[0]}</span><span class="rank-val">${m[1]} VENDUTI</span></div>`).join('');
        }

        function exportDB() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let a = document.createElement('a'); a.href = dataStr; a.download = "kickzone_backup.json"; a.click();
        }

        function importDB() {
            let input = document.createElement('input'); input.type = 'file';
            input.onchange = e => {
                let reader = new FileReader();
                reader.onload = ev => { db = JSON.parse(ev.target.result); save(); alert("Dati importati!"); };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }
    </script>
</body>
</html>
