<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: env(safe-area-inset-top) 15px 30px 15px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 2px; }

        .menu-btn { width: 30px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1001; }
        .menu-btn span { display: block; height: 3px; width: 100%; background: var(--accent); border-radius: 3px; }

        .side-menu { position: fixed; top: 0; right: -100%; width: 75%; height: 100%; background: #111; z-index: 1000; padding: 80px 25px; transition: 0.4s; border-left: 1px solid #222; }
        .side-menu.open { right: 0; }
        .menu-link { display: block; color: white; font-size: 16px; margin-bottom: 25px; text-decoration: none; text-transform: uppercase; font-weight: 600; }

        /* BADGE E GOAL */
        .badge-box { text-align: center; margin-bottom: 10px; }
        #userBadge { font-size: 10px; font-weight: 800; padding: 4px 12px; border-radius: 50px; background: #222; color: var(--accent); border: 1px solid var(--accent); text-transform: uppercase; }
        
        .goal-container { background: #1a1a1a; border-radius: 10px; height: 20px; width: 100%; margin: 10px 0 25px; position: relative; overflow: hidden; border: 1px solid #333; }
        .goal-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: 1s ease; }

        /* GRID */
        .page { display: none; }
        .active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { background: var(--card); border: 1px solid #222; padding: 20px 10px; border-radius: 20px; text-align: center; }
        .btn:active { transform: scale(0.95); border-color: var(--accent); }

        /* STORICO */
        .list-box { background: var(--card); border-radius: 20px; padding: 15px; border: 1px solid #222; }
        .row { border-bottom: 1px solid #222; padding: 12px 0; font-size: 13px; }
        .row:last-child { border: none; }
        .row-top { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .img-preview { width: 100%; height: 100px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; background: #222; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 999; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="menu-btn" onclick="toggleMenu()"><span></span><span></span><span></span></div>
    </div>

    <div class="badge-box">
        <span id="userBadge">RESELLER JUNIOR</span>
    </div>

    <div class="goal-container">
        <div class="goal-bar" id="goalBar"></div>
    </div>

    <div class="side-menu" id="sideMenu">
        <a href="#" class="menu-link" onclick="showP('home')">🏠 Vendita</a>
        <a href="#" class="menu-link" onclick="showP('history')">📸 Archivio Foto</a>
        <a href="#" class="menu-link" onclick="exportData()">📥 Esporta Dati (Excel)</a>
        <a href="#" class="menu-link" onclick="showP('rank')">🏆 Classifica</a>
    </div>

    <div id="p-home" class="page active">
        <div class="grid">
            <div class="btn" onclick="addS('Jordan 4', 350, 100)"><b>Jordan 4</b><span>+100€</span></div>
            <div class="btn" onclick="addS('McQueen', 130, 50)"><b>McQueen</b><span>+50€</span></div>
            <div class="btn" onclick="addS('Travis Scott', 1100, 300)"><b>Travis Scott</b><span>+300€</span></div>
            <div class="btn" onclick="addS('Dunk Low', 180, 60)"><b>Dunk Low</b><span>+60€</span></div>
        </div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size:12px; margin-bottom:15px; color:#555;">STORICO E FOTO</h2>
        <div class="list-box" id="historyContent"></div>
    </div>

    <div id="p-rank" class="page">
        <div class="list-box" id="rankContent"></div>
    </div>

    <script>
        let sales = JSON.parse(localStorage.getItem('kzl_pro_sales')) || [];
        const GOAL = 1500;

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').style.display = document.getElementById('sideMenu').classList.contains('open') ? 'block' : 'none';
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            toggleMenu();
            if(id === 'history') updateHistory();
        }

        function addS(shoe, lordo, pDef) {
            let cl = prompt("Cliente:");
            if(!cl) return;
            let p = parseFloat(prompt("Profitto:", pDef));
            
            const sale = { id: Date.now(), shoe, cl, lordo, p, date: new Date().toLocaleDateString(), img: null };
            sales.push(sale);
            save();
            updateUI();
        }

        function save() { localStorage.setItem('kzl_pro_sales', JSON.stringify(sales)); }

        function updateUI() {
            let totalP = sales.reduce((a, b) => a + b.p, 0);
            let percent = (totalP / GOAL) * 100;
            document.getElementById('goalBar').style.width = Math.min(percent, 100) + "%";
            
            let badge = "RESELLER JUNIOR";
            if(totalP > 500) badge = "PLUG ESPERTO";
            if(totalP > 1500) badge = "KING OF THE LAB 👑";
            document.getElementById('userBadge').innerText = badge;
        }

        function updateHistory() {
            let html = "";
            sales.slice().reverse().forEach(s => {
                html += `<div class="row">
                    <div class="row-top"><b>${s.cl}</b><span>${s.date}</span></div>
                    <div>${s.shoe} - <span style="color:var(--green)">+${s.p}€</span></div>
                    <input type="file" accept="image/*" onchange="uploadImg(this, ${s.id})" style="margin-top:10px; font-size:10px;">
                    <img id="img-${s.id}" src="${s.img || ''}" class="img-preview" style="display:${s.img ? 'block' : 'none'}">
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "Nessuna vendita.";
        }

        function uploadImg(input, id) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const sale = sales.find(s => s.id === id);
                sale.img = e.target.result;
                save();
                updateHistory();
            };
            reader.readAsDataURL(input.files[0]);
        }

        function exportData() {
            let csv = "Data,Cliente,Scarpa,Lordo,Profitto\n";
            sales.forEach(s => csv += `${s.date},${s.cl},${s.shoe},${s.lordo},${s.p}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'KICKZONELAB_Report.csv');
            a.click();
        }

        updateUI();
    </script>
</body>
</html>
