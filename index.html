<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KickZoneLab - Sales & Goals Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0c0f14;
      --card-bg: #161b22;
      --accent-blue: #00e5ff;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: #21262d;
      --danger-color: #ff4d4d;
      --success-color: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 15px; }

    .container { max-width: 900px; margin: 0 auto; }

    /* Header e Logo */
    header { text-align: center; margin-bottom: 30px; }
    header img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-blue); box-shadow: 0 0 20px rgba(0, 229, 255, 0.4); object-fit: cover; }
    header h1 { font-size: 2.2rem; margin-top: 10px; color: #fff; letter-spacing: 1px; }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    /* Grid Layout */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Card */
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .card h2 { font-size: 1.2rem; margin-bottom: 15px; color: var(--accent-blue); display: flex; align-items: center; justify-content: space-between; }

    /* Statistiche */
    .stats-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent-blue); }
    .stat-box.profit { border-left-color: var(--success-color); }
    .stat-box p { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-box span { font-size: 1.4rem; font-weight: 700; }

    /* Sezione Obiettivi */
    .goal-input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    .goal-input-group input { flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color); background: #0d1117; color: #fff; }
    .goal-input-group button { padding: 8px 15px; background: var(--accent-blue); border: none; border-radius: 6px; font-weight: 600; cursor: pointer; color: #000; }

    .progress-bar-bg { width: 100%; height: 12px; background: #21262d; border-radius: 6px; overflow: hidden; margin-top: 8px; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #00e5ff, #00e676); width: 0%; transition: width 0.4s ease; }
    .progress-text { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; display: flex; justify-content: space-between; }

    /* Form Inserimento */
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    form input { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: #0d1117; color: #fff; font-size: 0.9rem; }
    form input:focus { outline: 1px solid var(--accent-blue); }
    form button { grid-column: span 2; padding: 12px; background: var(--accent-blue); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer; transition: 0.2s; }
    form button:hover { box-shadow: 0 0 15px rgba(0, 229, 255, 0.5); }

    /* Tabella */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    th { text-align: left; padding: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
    td { padding: 12px; border-bottom: 1px solid var(--border-color); }
    .btn-delete { background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.1rem; }
    .positive { color: var(--success-color); font-weight: 600; }
    .negative { color: var(--danger-color); font-weight: 600; }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <img src="logo.png" alt="KickZoneLab Logo" onerror="this.style.display='none'">
    <h1>KICKZONELAB</h1>
    <p>Resell Sales & Goals Tracker</p>
  </header>

  <div class="grid-2">
    <div class="card">
      <h2>In Evidenza</h2>
      <div class="stats-container">
        <div class="stat-box">
          <p>Vendite Totali</p>
          <span id="total-sales">€ 0.00</span>
        </div>
        <div class="stat-box profit">
          <p>Profitto Netto</p>
          <span id="total-profit">€ 0.00</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Obiettivo Profitto</h2>
      <div class="goal-input-group">
        <input type="number" id="goal-input" placeholder="Imposta Target (€)" value="1000">
        <button id="set-goal-btn">Salva</button>
      </div>
      <div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="goal-bar"></div>
        </div>
        <div class="progress-text">
          <span id="goal-progress-text">0.0% completato</span>
          <span id="goal-target-text">Target: € 1000</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom: 25px;">
    <h2>Nuova Vendita</h2>
    <form id="sale-form">
      <input type="text" id="product" placeholder="Nome Prodotto / Sneaker" required>
      <input type="text" id="buyer" placeholder="Acquirente / Persona" required>
      <input type="number" id="buy-price" placeholder="Prezzo Acquisto (€)" step="0.01" required>
      <input type="number" id="sell-price" placeholder="Prezzo Vendita (€)" step="0.01" required>
      <button type="submit">+ AGGIUNGI VENDITA</button>
    </form>
  </div>

  <div class="card">
    <h2>Storico Vendite</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Prodotto</th>
            <th>Acquirente</th>
            <th>Acquisto</th>
            <th>Vendita</th>
            <th>Profitto</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="sales-table"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  let sales = JSON.parse(localStorage.getItem('kzl_sales')) || [];
  let profitGoal = parseFloat(localStorage.getItem('kzl_goal')) || 1000;

  const saleForm = document.getElementById('sale-form');
  const salesTable = document.getElementById('sales-table');
  const totalSalesEl = document.getElementById('total-sales');
  const totalProfitEl = document.getElementById('total-profit');

  const goalInput = document.getElementById('goal-input');
  const setGoalBtn = document.getElementById('set-goal-btn');
  const goalBar = document.getElementById('goal-bar');
  const goalProgressText = document.getElementById('goal-progress-text');
  const goalTargetText = document.getElementById('goal-target-text');

  goalInput.value = profitGoal;

  setGoalBtn.addEventListener('click', () => {
    const newGoal = parseFloat(goalInput.value);
    if (!isNaN(newGoal) && newGoal > 0) {
      profitGoal = newGoal;
      localStorage.setItem('kzl_goal', profitGoal);
      saveAndRender();
    }
  });

  saleForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const product = document.getElementById('product').value;
    const buyer = document.getElementById('buyer').value;
    const buyPrice = parseFloat(document.getElementById('buy-price').value);
    const sellPrice = parseFloat(document.getElementById('sell-price').value);
    const profit = sellPrice - buyPrice;

    const newSale = {
      id: Date.now(),
      product,
      buyer,
      buyPrice,
      sellPrice,
      profit
    };

    sales.push(newSale);
    saveAndRender();
    saleForm.reset();
  });

  function deleteSale(id) {
    sales = sales.filter(sale => sale.id !== id);
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('kzl_sales', JSON.stringify(sales));

    salesTable.innerHTML = '';

    let totalSalesSum = 0;
    let totalProfitSum = 0;

    sales.forEach(sale => {
      totalSalesSum += sale.sellPrice;
      totalProfitSum += sale.profit;

      const row = document.createElement('tr');
      const profitClass = sale.profit >= 0 ? 'positive' : 'negative';

      row.innerHTML = `
        <td><strong>${sale.product}</strong></td>
        <td>${sale.buyer}</td>
        <td>€ ${sale.buyPrice.toFixed(2)}</td>
        <td>€ ${sale.sellPrice.toFixed(2)}</td>
        <td class="${profitClass}">€ ${sale.profit.toFixed(2)}</td>
        <td style="text-align: right;"><button class="btn-delete" onclick="deleteSale(${sale.id})">✕</button></td>
      `;
      salesTable.appendChild(row);
    });

    totalSalesEl.textContent = `€ ${totalSalesSum.toFixed(2)}`;
    totalProfitEl.textContent = `€ ${totalProfitSum.toFixed(2)}`;

    goalTargetText.textContent = `Target: € ${profitGoal.toFixed(2)}`;
    const progressPercent = Math.max(0, Math.min((totalProfitSum / profitGoal) * 100, 100));
    
    goalBar.style.width = `${progressPercent}%`;
    goalProgressText.textContent = `${progressPercent.toFixed(1)}% completato`;
  }

  saveAndRender();
</script>

</body>
</html>
