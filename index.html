<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KZL ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: env(safe-area-inset-top) 15px 100px 15px; }

        /* Header fisso */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5px; }
        .header h1 { font-family: 'Montserrat'; font-size: 14px; letter-spacing: 2px; color: var(--accent); }

        /* Dashboard compatta */
        .top-stats { background: var(--card); border: 1px solid #222; border-radius: 20px; display: flex; justify-content: space-around; padding: 15px; margin-bottom: 20px; }
        .stat-box { text-align: center; }
        .stat-box b { display: block; font-size: 18px; color: white; }
        .stat-box span { font-size: 9px; color: #666; text-transform: uppercase; }

        /* Pagine */
        .page { display: none; }
        .active { display: block; }

        /* Griglia Bottoni */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--card); border: 1px solid #222; padding: 20px 10px; border-radius: 18px; text-align: center; }
        .btn:active { background: #1a1a1a; border-color: var(--accent); }
        .btn b { display: block; font-size: 14px; margin-bottom: 5px; }
        .btn span { font-size: 10px; color: var(--green); }

        /* Menu Basso Fisso */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #222; display: flex; justify-content: space-around; padding: 15px 10px 30px; }
        .nav-item { color: #555; font-size: 10px; font-weight: 600; text-transform: uppercase; text-decoration: none; border: none; background: none; }
        .nav-item.active { color: var(--accent); }

        /* Classifica */
        .rank-list { background: var(--card); border-radius: 15px; padding: 15px; border: 1px solid #222; }
        .rank-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; font-size: 13px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <img src="logo.png" style="width:30px; border-radius:5px;">
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="dLordo">0€</b><span>Lordo</span></div>
        <div class="stat-box"><b id="dProfit" style="color:var(--green)">0€</b><span>Profitto</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid">
            <div class="btn" onclick="addSale('Jordan 4', 350, 100)"><b>Jordan 4</b><span>+100€</span></div>
            <div class="btn" onclick="addSale('McQueen', 130, 50)"><b>McQueen</b><span>+50€</span></div>
            <div class="btn" onclick="addSale('Travis Scott', 1100, 300)"><b>Travis Scott</b><span>+300€</span></div>
            <div class="btn" onclick="addSale('Dunk Low', 180, 60)"><b>Dunk Low</b><span>+60€</span></div>
            <div class="btn" onclick="addSale('Campus', 120, 40)"><b>Campus</b><span>+40€</span></div>
            <div class="btn" onclick="addSale('Yeezy 350', 250, 80)"><b>Yeezy 350</b><span>+80€</span></div>
        </div>
    </div>

    <div id="p-rank" class="page">
        <h2 style="font-size:12px; color:#444; margin-bottom:10px;">TOP ARTICOLI</h2>
        <div class="rank-list" id="rankData">
            <p style="font-size:12px; color:#555;">Nessun dato</p>
        </div>
    </div>

    <div class="nav">
        <button class="nav-item active" onclick="tab('p-home', this)">🏠 Vendita</button>
        <button class="nav-item" onclick="tab('p-rank', this)">🏆 Classifica</button>
    </div>

    <script>
        let totalL = 0;
        let totalP = 0;
        let counts = {};

        function tab(pageId, el) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            el.classList.add('active');
            if(pageId === 'p-rank') showRank();
        }

        function addSale(name, lordo, profit) {
            let p = prompt("Profitto per " + name + ":", profit);
            if (p === null) return;
            p = parseFloat(p);

            totalL += lordo;
            totalP += p;
            counts[name] = (counts[name] || 0) + 1;

            document.getElementById('dLordo').innerText = totalL + "€";
            document.getElementById('dProfit').innerText = totalP + "€";
        }

        function showRank() {
            let html = "";
            let items = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            items.forEach(item => {
                html += `<div class="rank-row"><span>${item[0]}</span><b>${item[1]} Paia</b></div>`;
            });
            document.getElementById('rankData').innerHTML = html || "Vendi qualcosa per vedere la classifica!";
        }
    </script>
</body>
</html>
