<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; --red: #ff4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; padding: calc(env(safe-area-inset-top) + 20px) 15px 50px 15px; }

        /* SPLASH SCREEN */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: 0.8s; }
        #splash img { width: 100px; animation: pulse 2s infinite; margin-bottom: 20px; }
        #quote { font-family: 'Montserrat'; font-size: 11px; text-align: center; color: var(--accent); padding: 0 40px; text-transform: uppercase; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }

        /* HEADER & MENU */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-top: 10px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 2px; }
        
        .menu-icon { width: 30px; height: 20px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .menu-icon span { display: block; height: 3px; width: 100%; background: var(--accent); border-radius: 3px; }

        /* SIDE MENU */
        #side-menu { position: fixed; top: 0; right: -100%; width: 80%; height: 100%; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(15px); z-index: 1000; transition: 0.4s; padding: 60px 30px; border-left: 1px solid #222; }
        #side-menu.open { right: 0; }
        .menu-link { display: block; color: white; font-size: 18px; font-weight: bold; margin-bottom: 25px; text-decoration: none; font-family: 'Montserrat'; }
        .menu-link.active { color: var(--accent); }
        .close-menu { position: absolute; top: 25px; right: 25px; font-size: 30px; color: var(--accent); }

        /* STATS */
        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 18px 10px; text-align: center; }
        .stat-box b { display: block; font-size: 22px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; font-weight: 800; }

        /* GRID HOME */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 20px; text-align: center; overflow: hidden; padding-bottom: 12px; }
        .btn img { width: 100%; height: 110px; object-fit: contain; padding: 10px; }
        .del-item { position: absolute; top: 5px; right: 5px; background: var(--red); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid #000; }

        .add-btn { background: #111; border: 1px dashed var(--accent); padding: 20px; border-radius: 20px; color: var(--accent); text-align: center; font-weight: bold; margin-top: 10px; cursor: pointer; }

        /* SEZIONI */
        .page { display: none; }
        .page.active { display: block; }
        h2 { font-family: 'Montserrat'; font-size: 20px; margin-bottom: 20px; color: var(--accent); }

        /* IMPROVEMENT LIST (TIC VERDE) */
        .todo-item { background: var(--card); padding: 18px; border-radius: 15px; border: 1px solid #222; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .checkbox { width: 24px; height: 24px; border: 2px solid var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .todo-item.done { opacity: 0.5; border-color: var(--green); }
        .todo-item.done .checkbox { background: var(--green); border-color: var(--green); }
        .todo-item.done .checkbox::after { content: '✓'; color: #000; font-weight: bold; font-size: 14px; }
        .todo-item.done span { text-decoration: line-through; color: #666; }

        /* GOAL BAR */
        .goal-container { background: #111; border: 1px solid #222; border-radius: 15px; padding: 20px; }
        .goal-bar { width: 100%; height: 12px; background: #222; border-radius: 10px; margin: 10px 0; overflow: hidden; }
        #progress { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); width: 0%; transition: 1s; }

        .refresh-btn { margin-top: 40px; width: 100%; padding: 15px; border-radius: 15px; border: 1px solid var(--accent); background: none; color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2742/2742674.png'">
        <div id="quote">KICKZONELAB: GROW YOUR EMPIRE</div>
    </div>

    <div id="side-menu">
        <div class="close-menu" onclick="toggleMenu()">×</div>
        <a href="#" class="menu-link active" onclick="showPage('home')">HOME</a>
        <a href="#" class="menu-link" onclick="showPage('history')">STORICO</a>
        <a href="#" class="menu-link" onclick="showPage('goal')">OBIETTIVI</a>
        <a href="#" class="menu-link" onclick="showPage('improve')">MIGLIORA AZIENDA</a>
        <div style="margin-top: 50px;">
            <button onclick="exportDB()" style="color:#555; background:none; border:none; font-size:10px;">Esporta Backup</button>
        </div>
    </div>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="menu-icon" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="add-btn" onclick="addArticle()">➕ AGGIUNGI ARTICOLO</div>
        <button class="refresh-btn" onclick="location.reload()">REFRESH APP ↻</button>
    </div>

    <div id="p-goal" class="page">
        <h2>OBIETTIVI PROFITTO</h2>
        <div class="goal-container">
            <p style="font-size:12px; color:#666;">TARGET MENSILE: <b>1.500€</b></p>
            <div class="goal-bar"><div id="progress"></div></div>
            <p id="goalText" style="font-size:14px; font-weight:bold;"></p>
        </div>
    </div>

    <div id="p-improve" class="page">
        <h2>MIGLIORA AZIENDA</h2>
        <div id="improveList"></div>
        <div class="add-btn" onclick="addImprovement()">+ AGGIUNGI OBIETTIVO AZIENDALE</div>
    </div>

    <script>
        const KEY = 'KZL_V7_FINAL';
        let db = JSON.parse(localStorage.getItem(KEY)) || { items: [], sales: [], improvements: [] };

        window.onload = () => {
            setTimeout(() => { document.getElementById('splash').style.opacity = '0'; setTimeout(()=> document.getElementById('splash').style.display='none', 800); }, 2000);
            renderHome();
        };

        function toggleMenu() { document.getElementById('side-menu').classList.toggle('open'); }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
            document.getElementById('p-' + id).classList.add('active');
            toggleMenu();
            if(id==='goal') updateGoal();
            if(id==='improve') renderImprovements();
        }

        function save() { localStorage.setItem(KEY, JSON.stringify(db)); renderHome(); }

        function addArticle() {
            let name = prompt("Nome Scarpa:"); if(!name) return;
            let l = prompt("Lordo:"); let p = prompt("Profitto:");
            let input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let r = new FileReader();
                r.onload = ev => {
                    db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: ev.target.result });
                    save();
                };
                r.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            db.sales.push({ p: i.p, l: i.l, d: new Date().getMonth() });
            save(); alert("VENDUTO!");
        }

        function renderHome() {
            let html = "";
            db.items.forEach(i => {
                html += `<div class="btn-wrap">
                    <div class="del-item" onclick="event.stopPropagation(); db.items=db.items.filter(x=>x.id!=${i.id}); save();">×</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span style="color:var(--green)">+${i.p}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            let tL = db.sales.reduce((a,b)=> a+(b.l||0), 0);
            let tP = db.sales.reduce((a,b)=> a+(b.p||0), 0);
            document.getElementById('tLordo').innerText = tL+"€";
            document.getElementById('tProfit').innerText = tP+"€";
        }

        function updateGoal() {
            let target = 1500;
            let current = db.sales.reduce((a,b)=> a+(b.p||0), 0);
            let perc = Math.min((current / target) * 100, 100);
            document.getElementById('progress').style.width = perc + "%";
            document.getElementById('goalText').innerText = current + "€ / " + target + "€ (" + Math.floor(perc) + "%)";
        }

        /* LOGICA MIGLIORAMENTI (TIC VERDE) */
        function addImprovement() {
            let task = prompt("Cosa vuoi fare per migliorare l'azienda?");
            if(task) { db.improvements.push({ text: task, done: false }); save(); renderImprovements(); }
        }

        function toggleTask(index) {
            db.improvements[index].done = !db.improvements[index].done;
            save(); renderImprovements();
        }

        function renderImprovements() {
            document.getElementById('improveList').innerHTML = db.improvements.map((t, i) => `
                <div class="todo-item ${t.done ? 'done' : ''}" onclick="toggleTask(${i})">
                    <div class="checkbox"></div>
                    <span style="flex:1">${t.text}</span>
                    <div onclick="event.stopPropagation(); db.improvements.splice(${i},1); save(); renderImprovements();" style="color:var(--red); font-size:12px;">X</div>
                </div>
            `).join('') || "<p style='color:#444; text-align:center;'>Nessun obiettivo aggiunto.</p>";
        }

        function exportDB() { 
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let a = document.createElement('a'); a.href = dataStr; a.download = "kzl_backup.json"; a.click();
        }
    </script>
</body>
</html>
