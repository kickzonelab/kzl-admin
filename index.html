<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KZL ADMIN</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #111; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: white; margin: 0; padding: env(safe-area-inset-top) 15px 30px 15px; }

        /* Header e Barra compatta */
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 5px; }
        .logo-section { display: flex; align-items: center; gap: 8px; }
        .logo-section img { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--accent); }
        .logo-section h1 { font-family: 'Montserrat'; font-size: 12px; letter-spacing: 1px; margin: 0; }

        .top-bar { display: flex; gap: 15px; }
        .mini-stat { text-align: right; }
        .mini-stat b { display: block; font-size: 16px; color: var(--accent); line-height: 1; }
        .mini-stat span { font-size: 8px; color: #666; text-transform: uppercase; }

        /* Grafico più sottile */
        .chart-box { background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 10px; margin-bottom: 20px; height: 130px; }

        /* Griglia Bottoni */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: var(--card); border: 1px solid #252525; padding: 15px 10px; border-radius: 18px; text-align: center; }
        .btn:active { transform: scale(0.95); border-color: var(--accent); }
        .btn b { display: block; font-size: 13px; margin-bottom: 2px; }
        .btn span { font-size: 9px; color: var(--green); }

        /* Storico */
        #history { margin-top: 20px; border-top: 1px solid #222; padding-top: 15px; }
        .h-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #111; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header-box">
        <div class="logo-section">
            <img src="logo.png" alt="L">
            <h1>KICKZONELAB</h1>
        </div>
        <div class="top-bar">
            <div class="mini-stat"><b><span id="valLordo">0</span>€</b><span>Lordo</span></div>
            <div class="mini-stat"><b><span id="valProfit" style="color: var(--green);">0</span>€</b><span>Profit</span></div>
        </div>
    </div>

    <div class="chart-box">
        <canvas id="profitChart"></canvas>
    </div>

    <div class="grid">
        <div class="btn" onclick="addS('Jordan 4', 350, 100)"><b>Jordan 4</b><span>+100€</span></div>
        <div class="btn" onclick="addS('McQueen', 130, 50)"><b>McQueen</b><span>+50€</span></div>
        <div class="btn" onclick="addS('Travis Scott', 1100, 300)"><b>Travis Scott</b><span>+300€</span></div>
        <div class="btn" onclick="addS('Dunk Low', 180, 60)"><b>Dunk Low</b><span>+60€</span></div>
        <div class="btn" onclick="addS('Adidas Campus', 120, 40)"><b>Campus</b><span>+40€</span></div>
        <div class="btn" onclick="addS('Yeezy 350', 250, 80)"><b>Yeezy 350</b><span>+80€</span></div>
    </div>

    <div id="history">
        <div id="log"></div>
    </div>
