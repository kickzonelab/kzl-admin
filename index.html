<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --green: #00ff88; --red: #ff4444; --card: #111; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: #000; color: white; padding: 20px 15px; transition: 0.5s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 15px; padding: 15px; text-align: center; }
        .stat-box b { display: block; font-size: 18px; color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card); border-radius: 15px; border: 1px solid #222; overflow: hidden; position: relative; }
        .card img { width: 100%; height: 110px; object-fit: contain; background: #0a0a0a; padding: 10px; }
        
        /* CONTROLLI ORDINE */
        .order-controls { display: flex; justify-content: space-between; padding: 5px 10px; background: rgba(0,0,0,0.5); }
        .order-btn { color: var(--accent); font-weight: bold; font-size: 18px; width: 30px; text-align: center; }

        .card-info { padding: 8px; text-align: center; }
        .card-info b { font-size: 10px; display: block; text-transform: uppercase; margin-bottom: 5px; }
        
        .btn-vendi { background: var(--accent); color: #000; border: none; width: 100%; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 12px; }

        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #050505; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #222; z-index: 100; }
        .nav-btn { color: #666; text-decoration: none; font-size: 10px; font-family: 'Montserrat'; }
        .nav-btn.active { color: var(--accent); }

        .page { display: none; padding-bottom: 80px; }
        .page.active { display: block; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="font-family:'Montserrat'; font-size:16px;">KICKZONELAB</h1>
        <button onclick="pulisci()" style="background:none; border:none; color:#333; font-size:10px;">RESET</button>
    </div>

    <div id="stats-area" class="top-stats">
        <div class="stat-box"><b id="val-lordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="val-profit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="home" class="page active">
        <div class="grid" id="main-grid"></div>
        <button onclick="aggiungi()" style="width:100%; margin-top:20px; background:none; border:1px dashed #333; color:#666; padding:15px; border-radius:15px;">+ AGGIUNGI ALTRO</button>
    </div>

    <div id="history" class="page">
        <h2 style="margin-bottom:20px;">STORICO</h2>
        <div id="list-history"></div>
    </div>

    <div class="nav">
        <a href="#" class="nav-btn active" onclick="vai('home')">HOME</a>
        <a href="#" class="nav-btn" onclick="vai('history')">STORICO</a>
    </div>

    <script>
        const KEY = 'KZL_SISTEMA_ORDINE_V1';
        
        // DATI INIZIALI CON I TUOI MODELLI
        let defaultScarpe = [
            { id: 1, n: "LV SKATE", p: 100, l: 950, img: "lvskate" },
            { id: 2, n: "MCQUEEN", p: 60, l: 450, img: "" },
            { id: 3, n: "ASICS GEL", p: 40, l: 160, img: "" },
            { id: 4, n: "JORDAN 4", p: 70, l: 350, img: "" },
            { id: 5, n: "NUMERIS", p: 50, l: 200, img: "" },
            { id: 6, n: "GOLDEN GOOSE", p: 70, l: 420, img: "" },
            { id: 7, n: "NOCTA", p: 40, l: 190, img: "" },
            { id: 8, n: "OFF WHITE OOF", p: 80, l: 380, img: "" },
            { id: 9, n: "CAMPUS", p: 30, l: 120, img: "" },
            { id: 10, n: "DUNK SB", p: 45, l: 160, img: "" }
        ];

        let dati = JSON.parse(localStorage.getItem(KEY)) || { scarpe: defaultScarpe, vendite: [] };

        function vai(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'history') renderHistory();
        }

        function salva() {
            localStorage.setItem(KEY, JSON.stringify(dati));
            render();
        }

        function sposta(id, direzione) {
            let index = dati.scarpe.findIndex(x => x.id === id);
            let nuovoIndex = index + direzione;
            if (nuovoIndex >= 0 && nuovoIndex < dati.scarpe.length) {
                let temp = dati.scarpe[index];
                dati.scarpe[index] = dati.scarpe[nuovoIndex];
                dati.scarpe[nuovoIndex] = temp;
                salva();
            }
        }

        function vendi(id) {
            let s = dati.scarpe.find(x => x.id === id);
            dati.vendite.push({ n: s.n, p: s.p, l: s.l, d: new Date().toLocaleDateString() });
            salva();
            alert("VENDUTA: " + s.n);
        }

        function aggiungi() {
            let n = prompt("Nome:"); if(!n) return;
            let l = prompt("Lordo:");
            let p = prompt("Profitto:");
            dati.scarpe.push({ id: Date.now(), n, l: parseFloat(l), p: parseFloat(p), img: "" });
            salva();
        }

        function render() {
            let g = document.getElementById('main-grid');
            g.innerHTML = dati.scarpe.map(s => `
                <div class="card">
                    <div class="order-controls">
                        <div class="order-btn" onclick="sposta(${s.id}, -1)">‹</div>
                        <div class="order-btn" onclick="sposta(${s.id}, 1)">›</div>
                    </div>
                    <div style="height:90px; background:#1a1a1a; display:flex; align-items:center; justify-content:center; font-size:10px; color:#444;">
                        ${s.n}
                    </div>
                    <div class="card-info">
                        <b>${s.n}</b>
                        <button class="btn-vendi" onclick="vendi(${s.id})">VENDI (+${s.p}€)</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('val-lordo').innerText = dati.vendite.reduce((a,b) => a+b.l, 0) + "€";
            document.getElementById('val-profit').innerText = dati.vendite.reduce((a,b) => a+b.p, 0) + "€";
        }

        function renderHistory() {
            document.getElementById('list-history').innerHTML = dati.vendite.slice().reverse().map(v => `
                <div style="background:#111; padding:15px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; border:1px solid #222;">
                    <span><b>${v.n}</b><br><small>${v.d}</small></span>
                    <b style="color:var(--green)">+${v.p}€</b>
                </div>
            `).join('');
        }

        function pulisci() { if(confirm("Resettare ordine e vendite?")) { localStorage.clear(); location.reload(); } }

        render();
    </script>
</body>
</html>
