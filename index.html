<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            color: white; 
            padding: calc(env(safe-area-inset-top) + 20px) 15px 100px 15px; 
        }

        /* HEADER FISSO PER AGGIORNARE SEMPRE */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px;
        }
        .header h1 { font-family: 'Montserrat'; font-size: 15px; letter-spacing: 2px; }
        
        .refresh-btn {
            font-size: 10px;
            background: var(--accent);
            color: #000;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .top-stats { display: flex; gap: 10px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 18px; padding: 15px 10px; text-align: center; }
        .stat-box b { display: block; font-size: 20px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; font-weight: 800; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 18px; text-align: center; overflow: hidden; padding-bottom: 12px; width: 100%; }
        .btn img { width: 100%; height: 110px; object-fit: cover; border-bottom: 1px solid #222; background: #1a1a1a; }
        .btn b { display: block; font-size: 12px; padding: 8px 5px 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }
        
        .edit-badge { 
            position: absolute; top: 8px; right: 8px; background: var(--accent); color: #000; 
            border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; 
            justify-content: center; font-size: 14px; z-index: 10; font-weight: bold; border: 2px solid #000; 
        }

        .btn.special { 
            grid-column: span 2; 
            background: #111; 
            border: 1px dashed var(--accent); 
            padding: 20px; 
            margin-top: 10px; 
            border-radius: 18px; 
            color: var(--accent); 
            text-align: center; 
            font-weight: bold;
        }

        .page { display: none; }
        .active { display: block; }

        #nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(15px);
            display: flex; 
            justify-content: space-around; 
            padding: 15px 10px calc(15px + env(safe-area-inset-bottom)) 10px; 
            border-top: 1px solid #222; 
            z-index: 100; 
        }
        .nav-item { font-size: 11px; color: #555; text-decoration: none; font-weight: bold; letter-spacing: 1px; }
        .nav-item.active-nav { color: var(--accent); }

        .hist-card { background: #121212; padding: 12px; border-radius: 15px; margin-bottom: 10px; display: flex; align-items: center; border: 1px solid #222; }
        .hist-card img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; margin-right: 12px; }
        .hist-info { flex: 1; }
        .hist-price { color: var(--green); font-weight: bold; }
        
        /* TASTO RESET NASCOSTO IN BASSO */
        .debug-reset { text-align: center; margin-top: 40px; font-size: 10px; color: #333; }
    </style>
</head>
<body>

    <div class="header">
        <h1>KICKZONELAB</h1>
        <div class="refresh-btn" onclick="hardRefresh()">Refresh ↻</div>
    </div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="btn special" onclick="addArticle()">➕ AGGIUNGI ARTICOLO</div>
        <div class="debug-reset" onclick="resetAll()">Pulisci Cache e Reset</div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size:16px; margin-bottom:15px;">STORICO</h2>
        <div id="historyContent"></div>
    </div>

    <nav id="nav">
        <a href="#" class="nav-item active-nav" id="n-home" onclick="showP('home')">HOME</a>
        <a href="#" class="nav-item" id="n-history" onclick="showP('history')">STORICO</a>
    </nav>

    <script>
        const KEY = 'KZL_STORAGE_V1';
        const DEFAULT_IMG = "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=200&auto=format&fit=crop";

        let db = JSON.parse(localStorage.getItem(KEY)) || {
            items: [{ id: 1, name: 'Jordan 4', l: 350, p: 100, img: DEFAULT_IMG }],
            sales: []
        };

        // FUNZIONE REFRESH REALE
        function hardRefresh() {
            // Aggiunge un parametro casuale all'URL per forzare il download del nuovo codice
            window.location.href = window.location.pathname + '?reload=' + new Date().getTime();
        }

        function save() {
            localStorage.setItem(KEY, JSON.stringify(db));
            renderHome();
        }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById('p-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active-nav');
            if(id === 'history') renderHistory();
        }

        function addArticle() {
            let name = prompt("Modello:");
            if(!name) return;
            let l = prompt("Lordo:", "300");
            let p = prompt("Profitto:", "100");
            
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = (ev) => {
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let max_size = 400; 
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: canvas.toDataURL('image/jpeg', 0.6) });
                        save();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function editItem(id) {
            let i = db.items.find(x => x.id === id);
            let n = prompt("Nome:", i.name);
            if(!n) return;
            i.name = n;
            i.l = parseFloat(prompt("Lordo:", i.l));
            i.p = parseFloat(prompt("Profitto:", i.p));
            save();
        }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            let cl = prompt("Cliente:");
            if(!cl) return;
            db.sales.push({ name: i.name, cl, p: i.p, l: i.l, img: i.img, d: new Date().toLocaleDateString('it-IT') });
            save();
            alert("Venduto!");
        }

        function renderHome() {
            let html = "";
            db.items.forEach(i => {
                html += `
                <div class="btn-wrap">
                    <div class="edit-badge" onclick="event.stopPropagation(); editItem(${i.id})">✎</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span>+${i.p}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            updateStats();
        }

        function updateStats() {
            let tL = db.sales.reduce((a, b) => a + (b.l || 0), 0);
            let tP = db.sales.reduce((a, b) => a + (b.p || 0), 0);
            document.getElementById('tLordo').innerText = tL + "€";
            document.getElementById('tProfit').innerText = tP + "€";
        }

        function renderHistory() {
            let html = "";
            db.sales.slice().reverse().forEach(s => {
                html += `<div class="hist-card">
                    <img src="${s.img}">
                    <div class="hist-info"><b>${s.cl}</b><br><small style="color:#666">${s.name}</small></div>
                    <div class="hist-price">+${s.p}€</div>
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "<p style='text-align:center; color:#444'>Vuoto</p>";
        }

        function resetAll() {
            if(confirm("Cancella tutto?")) { localStorage.clear(); location.reload(); }
        }

        renderHome();
    </script>
</body>
</html>
