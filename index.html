<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.png">
    <title>KICKZONELAB ADMIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #00e5ff; --bg: #000; --card: #121212; --green: #00ff88; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            background: var(--bg); 
            color: white; 
            padding: calc(env(safe-area-inset-top) + 40px) 15px 120px 15px; 
        }

        /* SPLASH SCREEN */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: 0.8s;
        }
        #splash img { width: 100px; animation: pulse 2s infinite; margin-bottom: 20px; }
        #quote { font-family: 'Montserrat'; font-size: 12px; text-align: center; color: var(--accent); padding: 0 40px; text-transform: uppercase; letter-spacing: 1px; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }

        /* HEADER */
        .header { text-align: left; margin-bottom: 30px; }
        .header h1 { font-family: 'Montserrat'; font-size: 18px; letter-spacing: 3px; }

        /* STATS */
        .top-stats { display: flex; gap: 10px; margin-bottom: 30px; }
        .stat-box { flex: 1; background: var(--card); border: 1px solid #222; border-radius: 20px; padding: 20px 10px; text-align: center; }
        .stat-box b { display: block; font-size: 24px; color: var(--accent); }
        .stat-box span { font-size: 9px; color: #666; font-weight: 800; letter-spacing: 1px; }

        /* GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-wrap { position: relative; }
        .btn { background: var(--card); border: 1px solid #222; border-radius: 22px; text-align: center; overflow: hidden; padding-bottom: 15px; }
        .btn img { width: 100%; height: 120px; object-fit: contain; padding: 10px; background: #181818; }
        .btn b { display: block; font-size: 12px; padding: 10px 5px 2px; }
        .btn span { font-size: 10px; color: var(--green); font-weight: bold; }
        
        .del-btn { position: absolute; top: 8px; right: 8px; background: #ff4444; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; z-index: 5; border: 2px solid #000; }

        .add-btn { grid-column: span 2; background: #111; border: 1px dashed var(--accent); padding: 25px; margin-top: 10px; border-radius: 22px; color: var(--accent); text-align: center; font-weight: bold; font-size: 14px; }

        /* REFRESH IN FONDO */
        .refresh-area { grid-column: span 2; margin-top: 20px; text-align: center; }
        .big-refresh { background: rgba(0, 229, 255, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 15px; border-radius: 15px; font-weight: bold; font-size: 12px; width: 100%; }

        /* RANKING ITEMS */
        .rank-card { background: var(--card); padding: 15px; border-radius: 18px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #222; }
        .rank-info b { font-size: 14px; }
        .rank-info small { color: #555; display: block; }
        .rank-val { color: var(--accent); font-weight: bold; }

        /* NAV */
        .page { display: none; }
        .active { display: block; }
        #nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 20px 10px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid #222; z-index: 100; }
        .nav-item { font-size: 10px; color: #444; text-decoration: none; font-weight: bold; letter-spacing: 1px; }
        .nav-item.active-nav { color: var(--accent); }

        .sync-buttons { margin-top: 40px; display: flex; gap: 10px; justify-content: center; opacity: 0.3; }
        .sync-buttons button { background: none; border: 1px solid #333; color: #666; font-size: 8px; padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="logo.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2742/2742674.png'">
        <div id="quote">WORK IN SILENCE</div>
    </div>

    <div class="header"><h1>KICKZONELAB</h1></div>

    <div class="top-stats">
        <div class="stat-box"><b id="tLordo">0€</b><span>LORDO</span></div>
        <div class="stat-box"><b id="tProfit" style="color:var(--green)">0€</b><span>PROFITTO</span></div>
    </div>

    <div id="p-home" class="page active">
        <div class="grid" id="mainGrid"></div>
        <div class="grid" style="margin-top:15px;">
            <div class="add-btn" onclick="addArticle()">➕ AGGIUNGI ARTICOLO</div>
            <div class="refresh-area">
                <button class="big-refresh" onclick="hardRefresh()">AGGIORNA APP (REFRESH ↻)</button>
            </div>
        </div>
        <div class="sync-buttons">
            <button onclick="exportDB()">EXPORT JSON</button>
            <button onclick="importDB()">IMPORT JSON</button>
        </div>
    </div>

    <div id="p-history" class="page">
        <h2 style="font-size:16px; margin-bottom:20px; font-family:'Montserrat';">STORICO VENDITE</h2>
        <div id="historyContent"></div>
    </div>

    <div id="p-rank" class="page">
        <h2 style="font-size:16px; margin-bottom:20px; font-family:'Montserrat';">RANKING</h2>
        <h3 style="font-size:10px; color:#555; margin-bottom:10px; text-transform:uppercase;">Top Clienti</h3>
        <div id="rankClients"></div>
        <h3 style="font-size:10px; color:#555; margin-top:20px; margin-bottom:10px; text-transform:uppercase;">Modelli Caldi</h3>
        <div id="rankModels"></div>
    </div>

    <nav id="nav">
        <a href="#" class="nav-item active-nav" id="n-home" onclick="showP('home')">HOME</a>
        <a href="#" class="nav-item" id="n-history" onclick="showP('history')">STORICO</a>
        <a href="#" class="nav-item" id="n-rank" onclick="showP('rank')">RANKING</a>
    </nav>

    <script>
        const KEY = 'KZL_MASTER_V5';
        const quotes = [
            "SOLO CHI RISCHIA DI ANDARE TROPPO LONTANO SCOPRE DOVE PUÒ ARRIVARE.",
            "NON CONTA LA SCARPA, MA IL PASSO DI CHI LA INDOSSA.",
            "OGNI VENDITA È UN MATTONE PER IL TUO IMPERO.",
            "LAVORA FINCHÉ IL TUO CONTO NON SEMBRA UN NUMERO DI TELEFONO.",
            "IL SUCCESSO È L'UNICA OPZIONE.",
            "KICKZONELAB: STEP INTO THE FUTURE."
        ];

        let db = JSON.parse(localStorage.getItem(KEY)) || { items: [], sales: [] };

        window.onload = () => {
            const day = new Date().getDate();
            document.getElementById('quote').innerText = quotes[day % quotes.length];
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => document.getElementById('splash').style.display = 'none', 800);
            }, 2200);
            renderHome();
        };

        function hardRefresh() { window.location.href = window.location.pathname + '?v=' + Date.now(); }
        function save() { localStorage.setItem(KEY, JSON.stringify(db)); renderHome(); }

        function showP(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById('p-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active-nav');
            if(id === 'history') renderHistory();
            if(id === 'rank') renderRank();
            window.scrollTo(0,0);
        }

        function addArticle() {
            let name = prompt("Modello:"); if(!name) return;
            let l = prompt("Lordo (€):", "300");
            let p = prompt("Profitto (€):", "100");
            let input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                let reader = new FileReader();
                reader.onload = ev => {
                    let img = new Image();
                    img.onload = () => {
                        let canvas = document.createElement('canvas');
                        let max = 400; let w = img.width; let h = img.height;
                        if (w > h) { if (w > max) { h *= max / w; w = max; } }
                        else { if (h > max) { w *= max / h; h = max; } }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        db.items.push({ id: Date.now(), name, l: parseFloat(l), p: parseFloat(p), img: canvas.toDataURL('image/jpeg', 0.7) });
                        save();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function sell(id) {
            let i = db.items.find(x => x.id === id);
            let cl = prompt("Nome Cliente:"); if(!cl) return;
            db.sales.push({ name: i.name, cl, p: i.p, l: i.l, img: i.img, d: new Date().toLocaleDateString('it-IT') });
            save();
            alert("VENDUTO!");
        }

        function deleteItem(id) { if(confirm("Eliminare?")) { db.items = db.items.filter(x => x.id !== id); save(); } }

        function renderHome() {
            let html = "";
            db.items.forEach(i => {
                html += `<div class="btn-wrap">
                    <div class="del-btn" onclick="event.stopPropagation(); deleteItem(${i.id})">×</div>
                    <div class="btn" onclick="sell(${i.id})">
                        <img src="${i.img}">
                        <b>${i.name}</b>
                        <span>+${i.p}€</span>
                    </div>
                </div>`;
            });
            document.getElementById('mainGrid').innerHTML = html;
            updateStats();
        }

        function updateStats() {
            let tL = db.sales.reduce((a, b) => a + (b.l || 0), 0);
            let tP = db.sales.reduce((a, b) => a + (b.p || 0), 0);
            document.getElementById('tLordo').innerText = tL + "€";
            document.getElementById('tProfit').innerText = tP + "€";
        }

        function renderHistory() {
            let html = "";
            db.sales.slice().reverse().forEach(s => {
                html += `<div class="rank-card">
                    <img src="${s.img}" style="width:40px; height:40px; object-fit:cover; border-radius:8px; margin-right:12px;">
                    <div class="rank-info" style="flex:1"><b>${s.cl}</b><small>${s.name}</small></div>
                    <div class="rank-val">+${s.p}€</div>
                </div>`;
            });
            document.getElementById('historyContent').innerHTML = html || "Nessun dato.";
        }

        function renderRank() {
            let c = {}; let m = {};
            db.sales.forEach(s => { c[s.cl] = (c[s.cl] || 0) + 1; m[s.name] = (m[s.name] || 0) + 1; });
            let sortC = Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0,5);
            let sortM = Object.entries(m).sort((a,b) => b[1]-a[1]).slice(0,5);
            document.getElementById('rankClients').innerHTML = sortC.map(x => `<div class="rank-card"><b>${x[0]}</b><span>${x[1]} paia</span></div>`).join('');
            document.getElementById('rankModels').innerHTML = sortM.map(x => `<div class="rank-card"><b>${x[0]}</b><span>${x[1]} venduti</span></div>`).join('');
        }

        function exportDB() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            let a = document.createElement('a'); a.href = dataStr; a.download = "kzl_backup.json"; a.click();
        }

        function importDB() {
            let i = document.createElement('input'); i.type = 'file';
            i.onchange = e => {
                let r = new FileReader();
                r.onload = ev => { db = JSON.parse(ev.target.result); save(); alert("Dati caricati!"); };
                r.readAsText(e.target.files[0]);
            };
            i.click();
        }
    </script>
</body>
</html>
